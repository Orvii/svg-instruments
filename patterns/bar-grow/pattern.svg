<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" role="img" aria-label="Four bars growing from the baseline, staggered">
  <style>
    .grow { animation: grow .9s cubic-bezier(.4,0,.2,1) both; }
    .g1 { animation-delay: .2s; } .g2 { animation-delay: .4s; }
    .g3 { animation-delay: .6s; } .g4 { animation-delay: .8s; }
    .bar { transform-box: fill-box; transform-origin: bottom; }
    @keyframes grow { from { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
  </style>

  <rect width="600" height="160" fill="#0b0806"/>
  <line x1="40" y1="130" x2="560" y2="130" stroke="#3a2c1e" stroke-width="1"/>

  <!-- attributes hold the finished bars; the from-keyframe supplies zero height -->
  <g class="grow g1"><rect class="bar" x="80"  y="70" width="70" height="60" fill="#FE9106"/></g>
  <g class="grow g2"><rect class="bar" x="200" y="45" width="70" height="85" fill="#FEAF12"/></g>
  <g class="grow g3"><rect class="bar" x="320" y="88" width="70" height="42" fill="#F05F03"/></g>
  <g class="grow g4"><rect class="bar" x="440" y="60" width="70" height="70" fill="#FE7007"/></g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6e5c50" text-anchor="middle">
    <text x="115" y="148">q1</text>
    <text x="235" y="148">q2</text>
    <text x="355" y="148">q3</text>
    <text x="475" y="148">q4</text>
  </g>
</svg>
