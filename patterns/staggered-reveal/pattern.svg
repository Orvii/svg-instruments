<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Four cards revealing in a staggered cascade">
  <style>
    .item { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
    @media (prefers-reduced-motion: reduce) { .item { animation: none; } }
  </style>

  <rect width="600" height="200" fill="#0b0806"/>

  <g class="item">
    <rect x="40" y="50" width="115" height="100" rx="8" fill="#140d08" stroke="#3a2c1e"/>
    <text x="97" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FE9106">01</text>
    <text x="97" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b7a496">observe</text>
  </g>
  <g class="item" style="animation-delay:.25s">
    <rect x="175" y="50" width="115" height="100" rx="8" fill="#140d08" stroke="#3a2c1e"/>
    <text x="232" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FE9106">02</text>
    <text x="232" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b7a496">hypothesize</text>
  </g>
  <g class="item" style="animation-delay:.5s">
    <rect x="310" y="50" width="115" height="100" rx="8" fill="#140d08" stroke="#3a2c1e"/>
    <text x="367" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FE9106">03</text>
    <text x="367" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b7a496">measure</text>
  </g>
  <g class="item" style="animation-delay:.75s">
    <rect x="445" y="50" width="115" height="100" rx="8" fill="#140d08" stroke="#FE7007"/>
    <text x="502" y="95" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FEAF12">04</text>
    <text x="502" y="120" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#b7a496">publish</text>
  </g>
</svg>
