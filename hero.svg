<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="svg-instruments — five animated SVG patterns that survive the GitHub sanitizer">
  <style>
    .draw { animation: draw 2.2s cubic-bezier(.4,0,.2,1) .4s both; }
    .type1 { animation: type .7s steps(12) 1.0s both; }
    .type2 { animation: type .7s steps(12) 1.9s both; }
    .flow { animation: flow 2.6s linear infinite; }
    .scan { animation: sweep 5s linear 2.8s infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(180px); } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes blink { 0%,60% { opacity: 1; } 60.1%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, .type1, .type2, .flow, .scan, .pulse, .cur { animation: none; }
    }
  </style>

  <rect width="1200" height="360" fill="#0b0806"/>

  <!-- title -->
  <text x="60" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#F8F5F2">svg-instruments</text>
  <text x="60" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="1.5" fill="#FE9106">animated SVG that survives the GitHub sanitizer</text>
  <rect x="60" y="136" width="110" height="3" fill="#FE9106"/>

  <!-- five cells, each demonstrating its own technique -->
  <g stroke="#3a2c1e" stroke-width="1" fill="none">
    <rect x="60" y="170" width="200" height="130" rx="8"/>
    <rect x="290" y="170" width="200" height="130" rx="8"/>
    <rect x="520" y="170" width="200" height="130" rx="8"/>
    <rect x="750" y="170" width="200" height="130" rx="8"/>
    <rect x="980" y="170" width="160" height="130" rx="8"/>
  </g>

  <!-- 1 draw-on-line -->
  <path class="draw" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"
        d="M80 250 L120 250 L140 215 L160 275 L180 235 L240 235"
        fill="none" stroke="#FE9106" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">draw-on-line</text>

  <!-- 2 type-on-terminal -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#F8F5F2">
    <text class="type1" x="310" y="225">$ measure</text>
    <text class="type2" x="310" y="252">$ publish</text>
    <rect class="cur" x="392" y="240" width="8" height="15" fill="#FEAF12"/>
  </g>
  <text x="310" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">type-on-terminal</text>

  <!-- 3 dash-flow -->
  <line class="flow" x1="540" y1="240" x2="700" y2="240" stroke="#FE9106" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="540" cy="240" r="5" fill="#FEAF12"/>
  <circle cx="700" cy="240" r="5" fill="#FEAF12"/>
  <text x="540" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">dash-flow</text>

  <!-- 4 scanline-sweep -->
  <rect x="770" y="200" width="160" height="70" fill="#1a120b"/>
  <g class="scan"><rect x="770" y="200" width="2" height="70" fill="#FE7007" opacity=".8"/></g>
  <text x="770" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">scanline-sweep</text>

  <!-- 5 breathe-glow -->
  <circle class="pulse" cx="1060" cy="235" r="16" fill="#FE9106" opacity=".9"/>
  <circle class="pulse" cx="1060" cy="235" r="28" fill="none" stroke="#FE9106" stroke-width="1.5" style="animation-delay:1.1s"/>
  <text x="1000" y="288" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">breathe-glow</text>

  <text x="60" y="336" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6e5c50">CSS keyframes only · no scripts · degrades to a finished still · honors reduced motion</text>
</svg>
